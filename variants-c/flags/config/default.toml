# The canonical runtime config (spec §The config file): every value here
# overrides the built-in constants in main/config.c, and NVS overrides
# these in turn — one precedence rule, NVS > file > built-ins.
#
# Secrets never live in this file: API key, Wi-Fi credentials, and client
# certificate/key are provisioned into NVS only. The placeholders below are
# documentation, not values a device would use.

[sensor]
id = "00000000-0000-0000-0000-000000000000" # real UUID lives in NVS

[sampling]
decibel_window_ms = 1000 # Fast windows are 125 ms inside this
report_interval_s = 60   # per-type reporting cadence
offline_buffer = 64      # measurements held while disconnected

[sensors.bme280]
i2c_address = 0x76

[sensors.pir]
gpio_pin = 4

[transport]
active = "http" # "http" | "mqtt"
http_endpoint = "https://ingest.clubins.de/v1/sensors"

[transport.mqtt]
broker = "mqtt.clubins.de"
port = 8883 # TLS listener; plain 1883 only without mTLS

[decibel]
overload_threshold_db = 120.0
calibration_offset_db = 0.0 # per-unit value from NVS at runtime
