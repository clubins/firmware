# Clubins firmware CI.
#
# GitHub-hosted runners (this repo has no self-hosted NixOS runner). Every
# job installs Nix with the Determinate Systems installer and runs through
# the pinned toolchain shell (shell.nix + esp-toolchain.nix) inside
# `nix-shell --pure`, so CI matches local builds exactly.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Push and PR runs share the source branch; forks keep their own group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  host-check:
    name: Host check (fmt, clippy, tests, Xtensa check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix (Determinate Systems installer)
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Host check
        run: nix-shell --pure --run 'just check'

  flag-matrix:
    name: Flag matrix (all-off, each flag alone, all-on)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix (Determinate Systems installer)
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Compile-verify the flag matrix
        run: nix-shell --pure --run 'just flag-matrix'

  xtensa:
    name: ESP32-S3 release builds (Xtensa)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix (Determinate Systems installer)
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Link all-off release image
        run: nix-shell --pure --run 'just xtensa-build-off'

      - name: Link all-features release image
        run: nix-shell --pure --run 'just xtensa-build-all'
