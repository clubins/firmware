# CI for the C2 workspace variant (variants-c/workspace/).
#
# ESP-IDF multi-component project — the C port of Rust V2's workspace.
# Gates:
#   1. clang-format — the variant's C convention
#   2. Host flag matrix — all 17 Kconfig combinations (CTest + Unity),
#      seconds per combination on the platform-agnostic core
#   3. Device build (default sdkconfig) — ESP32-S3 links via
#      espressif/esp-idf-ci-action on GitHub-hosted ubuntu-latest
#   4. Device build (all 15 features on) — same action, all-features
#      sdkconfig defaults
#
# ESP-IDF pin: v5.5.6 — shared across all variants-c/ variants (README).

name: c2-workspace-ci

on:
  push:
    branches: ["**"]
    paths:
      - "variants-c/workspace/**"
      - ".github/workflows/ci-c2.yml"
  pull_request:
    paths:
      - "variants-c/workspace/**"
      - ".github/workflows/ci-c2.yml"

concurrency:
  group: c2-workspace-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: variants-c/workspace
  IDF_VERSION: v5.5.6

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting (C2 sources, vendored Unity excluded)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          files=$(find components main host tools -name '*.c' -o -name '*.h' | grep -v '^host/unity/' || true)
          if [ -z "$files" ]; then
            echo "no C sources found" >&2; exit 1
          fi
          clang-format --dry-run --Werror $files
          echo "clang-format: clean"

  host-flag-matrix:
    name: host CTest — 17-combination flag matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Run the 17-combination flag matrix (host CTest + Unity)
        working-directory: ${{ env.APP_DIR }}
        run: tools/flag-matrix.sh

  device-build-default:
    name: ESP-IDF v5.5.6 — esp32s3 build (default sdkconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ESP-IDF build (capabilities all-off)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: ${{ env.APP_DIR }}

  device-build-all-features:
    name: ESP-IDF v5.5.6 — esp32s3 build (all 15 features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ESP-IDF build (capabilities all-on)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: ${{ env.APP_DIR }}
          command: idf.py -D SDKCONFIG_DEFAULTS=sdkconfig.defaults.all-features build
