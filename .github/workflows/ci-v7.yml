# CI for the v7-dualcore variant (strict core partitioning).
#
# Self-contained by design: every gate runs inside the variant's own pinned
# Nix shell, from the variants/v7-dualcore/ directory. The repo root hosts
# no toolchain; other variants carry their own ci-vN workflows with the same
# path filters, so a variant's CI only runs when that variant changes.
name: ci-v7

on:
  pull_request:
    paths:
      - "variants/v7-dualcore/**"
      - ".github/workflows/ci-v7.yml"
  push:
    branches: [main]
    paths:
      - "variants/v7-dualcore/**"
      - ".github/workflows/ci-v7.yml"

concurrency:
  group: ci-v7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The full host gate: cargo fmt --check, clippy -D warnings, build, tests.
    name: Host check (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/v7-dualcore
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix-shell --pure --run 'just check'

  flag-matrix:
    # Every public leaf must compile alone (no hidden coupling between
    # flags), plus the all-off and all-on anchors. For the dual-core
    # partition this guards the cross-core boundary: the queues and
    # mailbox must compile for every sensor/transport/ops selection.
    name: Flag matrix (all-off, each leaf alone, all-on)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/v7-dualcore
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix-shell --pure --run 'just flag-matrix'

  xtensa:
    # The ESP32-S3 release ELF must link on the pinned fork toolchain for
    # both anchor feature sets. rust-lld + -Tlinkall.x wire the linker;
    # -Zbuild-std=core,alloc rebuilds the standard crates (the fork ships
    # no prebuilt rust-std for Xtensa). The fork toolchain comes from
    # esp-toolchain.nix. GitHub-hosted runners only — there is no
    # self-hosted runner.
    name: ESP32-S3 release ELF (default + all features)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/v7-dualcore
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: |
          nix-shell --pure --run 'just build-esp'
          nix-shell --pure --run 'just build-esp "--all-features"'
