# CI for the v5-hsm variant (hierarchical state-machine, event-driven).
#
# Self-contained by design: every gate runs inside the variant's own pinned
# Nix shell, from the variants/v5-hsm/ directory. The repo root hosts no
# toolchain; other variants carry their own ci-vN workflows with the same
# path filters, so a variant's CI only runs when that variant changes.
name: ci-v5

on:
  pull_request:
    paths:
      - "variants/v5-hsm/**"
      - ".github/workflows/ci-v5.yml"
  push:
    branches: [main]
    paths:
      - "variants/v5-hsm/**"
      - ".github/workflows/ci-v5.yml"

concurrency:
  group: ci-v5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The full host gate: cargo fmt --check, clippy -D warnings, build, tests.
    name: Host check (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/v5-hsm
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix-shell --pure --run 'just check'

  flag-matrix:
    # Every public leaf must compile alone (no hidden coupling between
    # flags), plus the all-off and all-on anchors.
    name: Flag matrix (all-off, each leaf alone, all-on)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/v5-hsm
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix-shell --pure --run 'just flag-matrix'

  xtensa:
    # The ESP32-S3 release ELF must link on the pinned fork toolchain for
    # both anchor feature sets. rust-lld + -Tlinkall.x wire the linker; the
    # fork toolchain (with the Xtensa backend) comes from esp-toolchain.nix.
    name: ESP32-S3 release ELF (default + all features)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/v5-hsm
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: |
          nix-shell --pure --run 'just build-esp'
          nix-shell --pure --run 'just build-esp "--all-features"'
