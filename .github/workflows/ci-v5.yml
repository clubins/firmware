# CI for the hierarchical state-machine firmware variant (variants/v5-hsm).
#
# GitHub-hosted runners + Nix — this repo has no self-hosted runner.
# The pinned toolchain comes from the variant's own shell.nix/esp-toolchain.nix;
# every job runs from the variant directory (no root-level files exist).
name: ci-v5

on:
  push:
    branches: [main]
    paths: ["variants/v5-hsm/**", ".github/workflows/ci-v5.yml"]
  pull_request:
    paths: ["variants/v5-hsm/**", ".github/workflows/ci-v5.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-check:
    name: host check (fmt + clippy + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: variants/v5-hsm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix-shell --pure --run 'just check'

  flag-matrix:
    name: flag matrix (all-off + 15 leaves + all-on, host)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: variants/v5-hsm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix-shell --pure --run 'just flag-matrix'

  xtensa:
    name: xtensa release build (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: variants/v5-hsm
    strategy:
      fail-fast: false
      matrix:
        features: [default, all-features]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build release ELF
        run: |
          if [ "${{ matrix.features }}" = "all-features" ]; then
            nix-shell --pure --run 'just build-esp --all-features'
          else
            nix-shell --pure --run 'just build-esp'
          fi
      - name: Verify the artifact is an Xtensa ELF
        run: |
          file target/xtensa-esp32s3-none-elf/release/firmware-v5-hsm | grep -q "Tensilica Xtensa"
      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-v5-hsm-xtensa-${{ matrix.features }}
          path: variants/v5-hsm/target/xtensa-esp32s3-none-elf/release/firmware-v5-hsm
          if-no-files-found: error
