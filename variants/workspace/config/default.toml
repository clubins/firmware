# Runtime tunables — compiled into the binary as defaults, with NVS overrides
# on top. Precedence: NVS value → this file → built-in constant.
#
# Secrets (Wi-Fi credentials, API key, client certificate and key) live ONLY
# in NVS, never here — this file is committed.
#
# The TOML loader and the NVS override layer land with the config task
# (V2-B2); until then firmware-core's Default impl carries these exact
# values, and this file is the human-facing source of truth.

[sensor]
# Real UUID lives in NVS; a fresh flash boots with the placeholder.
id = "00000000-0000-0000-0000-000000000000"

[sampling]
decibel_window_ms = 1000    # Fast windows are 125 ms inside this
report_interval_s = 60      # per-type reporting cadence
offline_buffer = 64         # measurements held while disconnected

[sensors.pir]
gpio_pin = 4                # convention — no PIR hardware documented

[sensors.bme280]
i2c_address = 0x76

[transport]
active = "http"             # "http" | "mqtt"
http_endpoint = "https://ingest.clubins.de/v1/sensors"

[transport.mqtt]
broker = "mqtt.clubins.de"
port = 8883                 # TLS listener; plain 1883 only without mTLS

[decibel]
overload_threshold_db = 120.0
calibration_offset_db = 0.0 # per-unit value from NVS at runtime
