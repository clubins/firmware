# Clubins firmware — canonical runtime defaults (variant C, embassy-async).
#
# This file is compiled into the binary as the defaults (src/config.rs embeds
# it with include_str!). At boot the firmware reads NVS overrides on top, so
# a device is tuned without a rebuild and a fresh flash still boots with
# sane defaults. Precedence rule, host-tested in tests/config_precedence.rs:
# NVS value > default.toml value > built-in constant (src/config.rs).
#
# Secrets (Wi-Fi credentials, API key, client certificate and key) live ONLY
# in NVS — this file holds placeholders and is committed. A secret key added
# here would be ignored: secret.* paths are only ever read from the NVS
# override source, never from this file.

[sensor]
id = "00000000-0000-0000-0000-000000000000" # real UUID lives in NVS

[sampling]
decibel_window_ms = 1000 # Fast windows are 125 ms inside this report
report_interval_s = 60   # per-type reporting cadence
offline_buffer = 64      # measurements held while disconnected

[sensors.bme280]
i2c_address = 0x76

[sensors.pir]
gpio_pin = 4

[transport]
active = "http" # "http" | "mqtt" — selects between compiled transports
http_endpoint = "https://ingest.clubins.de/v1/sensors"

[transport.mqtt]
broker = "mqtt.clubins.de"
port = 8883 # TLS listener; plain 1883 only without mTLS

[decibel]
overload_threshold_db = 120.0 # top of the mic's measurement range
calibration_offset_db = 0.0   # per-unit value from NVS at runtime
